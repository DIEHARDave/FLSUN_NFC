# FLSUN_NFC - Moonraker settings
# install.sh copies this file to ~/printer_data/config/flsun_nfc.conf once
# and never overwrites it.

[update_manager flsun_nfc]
type: git_repo
channel: stable
primary_branch: main
path: ~/FLSUN_NFC
origin: https://github.com/DIEHARDave/FLSUN_NFC.git
# Klipper loads the new code when it restarts.
managed_services: klipper
